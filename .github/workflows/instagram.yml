name: Instagram fixture
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/instagram/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/instagram.yml'
jobs:
  fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: postgres
      HUEY_DB_PATH: /tmp/instagram-qa/huey.sqlite3
      PAPERCLIP_SCRATCH_DIR: /tmp/instagram-qa
      PYTHONPATH: .
      INSTAGRAM_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p "$PAPERCLIP_SCRATCH_DIR"
      - run: pip install -r backend/requirements.txt -r tools/instagram/qa-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
      - run: python backend/manage.py makemigrations instagram --check --dry-run
      - run: python -m unittest tools.instagram.test_connector -v
      - run: python backend/manage.py test instagram --noinput
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-fixture-stills
          path: /tmp/instagram-qa/*.png
